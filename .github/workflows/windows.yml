name: Build Windows app
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BBeat-Video app.py
      - uses: actions/upload-artifact@v4
        with:
          name: BBeat-Video-Windows
          path: dist/BBeat-Video.exe
      # This artifact requires FFmpeg and FFprobe already installed in PATH.
